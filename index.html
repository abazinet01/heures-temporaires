<!DOCTYPE html>
<html lang="fr" data-periode="jour">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Heures temporaires — Québec</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23faf6ef'/%3E%3Cpath d='M16 3a13 13 0 0 1 0 26z' fill='%23ecd9b8'/%3E%3Cpath d='M16 29a13 13 0 0 1 0-26z' fill='%23c9d0de'/%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%238b5e3c' stroke-width='1.2'/%3E%3Ccircle cx='27' cy='12' r='3' fill='%23d4a843'/%3E%3C/svg%3E">
<style>
  /* ---------------------------------------------------------------------------
   * Deux palettes, et la page passe de l'une à l'autre au lever et au coucher.
   * C'était déjà l'intention de la version originale (classe night-mode), mais
   * seul le texte changeait : la nuit, il devenait beige sur fond crème.
   * ------------------------------------------------------------------------ */
  :root {
    --fond: #faf6ef;
    --encre: #5a3a1a;
    --accent: #8b5e3c;
    --doux: #a08a70;
    --filet: #d8c8ae;
    --filet-doux: #e9dfcd;
    --piste: #efe6d6;
    --soleil: #d4a843;
    --lune: #e4e9f3;

    --bande-jour: #f1e3c9;
    --bande-nuit: #dfe3ec;
    --passe-jour: #e8cf9f;
    --passe-nuit: #c7cfe0;
    --courant-jour: #d9b36c;
    --courant-nuit: #9dadcc;
    --chiffre-jour: #8b5e3c;
    --chiffre-nuit: #56688f;

    --ligne-active: #f1e3c9;
    --titre-jour: #8b5e3c;
    --titre-nuit: #3c5383;
  }

  :root[data-periode="nuit"] {
    --fond: #141b2e;
    --encre: #e8d5b7;
    --accent: #e0bd6a;
    --doux: #8795b4;
    --filet: #2f3a57;
    --filet-doux: #222b44;
    --piste: #222b44;
    --soleil: #d4a843;
    --lune: #e4e9f3;

    --bande-jour: #2a2d38;
    --bande-nuit: #1f2a47;
    --passe-jour: #3a3a3c;
    --passe-nuit: #2c3b63;
    --courant-jour: #6b5a36;
    --courant-nuit: #4a5f93;
    --chiffre-jour: #9c8a6c;
    --chiffre-nuit: #aab8d8;

    --ligne-active: #25325a;
    --titre-jour: #b89a6c;
    --titre-nuit: #aab8d8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { background: var(--fond); transition: background-color 1.2s ease; }

  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--fond);
    color: var(--encre);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 16px 1.5rem;
    transition: background-color 1.2s ease, color 1.2s ease;
  }

  h1 {
    font-size: 1.6rem;
    font-weight: normal;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    text-align: center;
  }

  .lieu {
    font-size: 0.85rem;
    color: var(--doux);
    letter-spacing: 0.08em;
    margin: 0.25rem 0 1.4rem;
    text-align: center;
  }

  .date {
    font-size: 1rem;
    text-align: center;
    color: var(--encre);
  }

  .soleil-infos {
    font-size: 0.85rem;
    color: var(--doux);
    text-align: center;
    margin: 0.3rem 0 1rem;
  }
  .soleil-infos strong { color: var(--accent); font-weight: normal; }
  .soleil-infos .sep { margin: 0 0.45em; opacity: 0.6; }

  /* --- Cadran -------------------------------------------------------------- */

  .cadran {
    position: relative;
    width: 380px;
    max-width: 100%;
    aspect-ratio: 1;
    margin-bottom: 1.2rem;
  }
  .cadran svg { width: 100%; height: 100%; display: block; overflow: visible; }

  .centre {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    width: 62%;
  }
  .centre .nom { font-size: 1.05rem; line-height: 1.3; }
  .centre .heure-civile {
    font-size: 2.4rem;
    color: var(--accent);
    letter-spacing: 0.04em;
    line-height: 1.15;
  }
  .centre .detail { font-size: 0.78rem; color: var(--doux); }

  .bande-jour { fill: var(--bande-jour); }
  .bande-nuit { fill: var(--bande-nuit); }
  .passe[data-p="jour"] { fill: var(--passe-jour); }
  .passe[data-p="nuit"] { fill: var(--passe-nuit); }
  .courant[data-p="jour"] { fill: var(--courant-jour); }
  .courant[data-p="nuit"] { fill: var(--courant-nuit); }
  .cadran circle.contour { fill: none; stroke: var(--filet); stroke-width: 1; }
  .trait { stroke: var(--fond); stroke-width: 1.25; }
  .trait.horizon { stroke: var(--soleil); stroke-width: 1.5; }
  .chiffre {
    font-family: Georgia, serif;
    font-size: 10.5px;
    text-anchor: middle;
    dominant-baseline: central;
    letter-spacing: 0.02em;
  }
  .chiffre[data-p="jour"] { fill: var(--chiffre-jour); }
  .chiffre[data-p="nuit"] { fill: var(--chiffre-nuit); }
  .chiffre.actif { fill: var(--encre); font-weight: bold; }
  .astre-soleil { fill: var(--soleil); }
  .astre-halo { fill: none; stroke: var(--soleil); stroke-width: 0.75; opacity: 0.55; }
  .astre-lune { fill: var(--lune); }
  .astre-ombre { fill: var(--fond); transition: fill 1.2s ease; }
  .repere { fill: none; stroke: var(--soleil); stroke-width: 1.2; }

  /* --- Progression dans l'heure -------------------------------------------- */

  .progression { width: 100%; max-width: 380px; text-align: center; margin-bottom: 2rem; }
  .piste {
    background: var(--piste);
    border-radius: 3px;
    height: 5px;
    overflow: hidden;
    margin-bottom: 0.45rem;
  }
  .piste div {
    height: 100%;
    border-radius: 3px;
    background: var(--soleil);
    transition: width 1s linear;
  }
  :root[data-periode="nuit"] .piste div { background: var(--courant-nuit); }
  .progression p { font-size: 0.8rem; color: var(--doux); }

  /* --- Les vingt-quatre heures --------------------------------------------- */

  .tables {
    display: flex;
    flex-wrap: wrap;
    gap: 1.5rem 2.5rem;
    justify-content: center;
    width: 100%;
    max-width: 760px;
  }
  .table { flex: 1 1 260px; max-width: 340px; }
  .table h2 {
    font-size: 0.9rem;
    font-weight: normal;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-align: center;
  }
  .table.jour h2 { color: var(--titre-jour); }
  .table.nuit h2 { color: var(--titre-nuit); }
  .table .sous-titre {
    font-size: 0.75rem;
    color: var(--doux);
    text-align: center;
    margin: 0.15rem 0 0.5rem;
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  td {
    padding: 0.3rem 0.6rem;
    border-bottom: 1px solid var(--filet-doux);
    font-variant-numeric: tabular-nums;
  }
  td:first-child { width: 3.2em; color: var(--doux); letter-spacing: 0.03em; }
  td.fin { text-align: right; }
  td .tiret { color: var(--doux); margin: 0 0.35em; }
  tr.passee td { opacity: 0.45; }
  tr.active td { background: var(--ligne-active); }
  tr.active td:first-child { color: var(--encre); font-weight: bold; }
  tr:first-child td { border-top: 1px solid var(--filet-doux); }
  td, tr { transition: background-color 1.2s ease; }
  tr td:first-child { border-radius: 3px 0 0 3px; }
  tr td:last-child { border-radius: 0 3px 3px 0; }

  .pied {
    margin-top: 2.2rem;
    font-size: 0.75rem;
    color: var(--doux);
    text-align: center;
    line-height: 1.7;
  }
  .pied a { color: inherit; text-decoration-color: var(--filet); text-underline-offset: 2px; }

  .bascule { display: none; }

  @media (max-width: 500px) {
    h1 { font-size: 1.25rem; }
    .centre .heure-civile { font-size: 2rem; }
  }

  /* ---------------------------------------------------------------------------
   * Mode « barre » : la même page, à l'étroit dans le panneau qui descend de la
   * barre des menus. Activé par l'app macOS, ou par ?barre dans l'adresse.
   * ------------------------------------------------------------------------ */
  :root.barre body { padding: 1.1rem 14px 1rem; min-height: 0; }
  :root.barre h1, :root.barre .lieu, :root.barre .pied { display: none; }
  :root.barre .date { font-size: 0.92rem; }
  :root.barre .soleil-infos { font-size: 0.78rem; margin-bottom: 0.6rem; }
  :root.barre .cadran { width: 300px; margin-bottom: 0.9rem; }
  :root.barre .centre .nom { font-size: 0.95rem; }
  :root.barre .centre .heure-civile { font-size: 2rem; }
  :root.barre .progression { margin-bottom: 0.8rem; }
  :root.barre .bascule {
    display: block;
    font: inherit;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--doux);
    background: none;
    border: 0;
    border-top: 1px solid var(--filet-doux);
    width: 100%;
    padding: 0.7rem 0 0.1rem;
    cursor: pointer;
  }
  :root.barre .bascule:hover,
  :root.barre .bascule:focus-visible { color: var(--accent); }
  :root.barre .bascule:focus { outline: none; }
  :root.barre .tables { display: none; gap: 1rem; margin-top: 0.8rem; }
  :root.barre.ouvert .tables { display: flex; }
  :root.barre .table { flex: 1 1 0; }
  :root.barre table { font-size: 0.78rem; }
  :root.barre td { padding: 0.22rem 0.3rem; }
  :root.barre td:first-child { width: 2.6em; }
  :root.barre .table h2 { font-size: 0.72rem; }
</style>
</head>
<body>

<h1>Heures temporaires</h1>
<p class="lieu" id="lieu">Québec · 46,81° N · 71,21° O</p>

<p class="date" id="date">—</p>
<p class="soleil-infos" id="soleil-infos">&nbsp;</p>

<div class="cadran">
  <svg id="cadran" viewBox="0 0 400 400" role="img" aria-labelledby="nom-heure"></svg>
  <div class="centre">
    <div class="nom" id="nom-heure">—</div>
    <div class="heure-civile" id="heure-civile">--:--</div>
    <div class="detail" id="detail">&nbsp;</div>
  </div>
</div>

<div class="progression">
  <div class="piste"><div id="piste"></div></div>
  <p id="progression">&nbsp;</p>
</div>

<button class="bascule" id="bascule" type="button">Les vingt-quatre heures</button>

<div class="tables">
  <section class="table jour">
    <h2>Heures du jour</h2>
    <p class="sous-titre" id="st-jour"></p>
    <table><tbody id="table-jour"></tbody></table>
  </section>
  <section class="table nuit">
    <h2>Heures de la nuit</h2>
    <p class="sous-titre" id="st-nuit"></p>
    <table><tbody id="table-nuit"></tbody></table>
  </section>
</div>

<p class="pied">
  Calcul solaire : algorithme de la NOAA · Heures temporaires à la manière antique<br>
  <a href="v1/">La version originale</a>
</p>

<script src="soleil.js"></script>
<script>
(function () {
  'use strict';

  var LIEU = Soleil.QUEBEC;
  var MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet',
    'août', 'septembre', 'octobre', 'novembre', 'décembre'];
  var JOURS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
  var NS = 'http://www.w3.org/2000/svg';
  var racine = document.documentElement;

  // L'app de la barre des menus pose window.HT_MODE avant le chargement.
  var params = new URLSearchParams(location.search);
  var barre = window.HT_MODE === 'barre' || params.has('barre');
  if (barre) racine.classList.add('barre');

  // ?t=2026-09-19T22:40 : faire comme s'il était cette heure-là (pour voir la
  // nuit en plein jour, ou le solstice en septembre). Le temps avance ensuite.
  var decalage = 0;
  if (params.get('t')) {
    var voulu = new Date(params.get('t')).getTime();
    if (!isNaN(voulu)) decalage = voulu - Date.now();
  }
  function maintenant() { return Date.now() + decalage; }

  // --- Formats -------------------------------------------------------------

  function deux(n) { return String(n).padStart(2, '0'); }

  /** Heure d'un événement, arrondie à la minute la plus proche (usage des éphémérides). */
  function hm(ms) {
    var d = new Date(Math.round(ms / 60000) * 60000);
    return deux(d.getHours()) + ':' + deux(d.getMinutes());
  }

  /** Heure affichée par l'horloge : tronquée, comme toute horloge. */
  function horloge(ms) {
    var d = new Date(ms);
    return deux(d.getHours()) + ':' + deux(d.getMinutes());
  }

  function minutes(ms) {
    return (ms / 60000).toFixed(1).replace('.', ',') + ' min';
  }

  function duree(ms) {
    var m = Math.round(ms / 60000);
    return Math.floor(m / 60) + ' h ' + deux(m % 60);
  }

  function ecartJour(ms) {
    var m = Math.round(ms / 60000);
    if (m === 0) return 'comme hier';
    return (m > 0 ? '+' : '−') + Math.abs(m) + ' min';
  }

  // --- Géométrie du cadran -------------------------------------------------

  var C = 200, R_EXT = 184, R_INT = 146, R_CHIFFRE = 165, R_ASTRE = 196;

  function point(r, deg) {
    var a = (deg - 90) * Math.PI / 180;
    return { x: C + r * Math.cos(a), y: C + r * Math.sin(a) };
  }

  function secteur(deg0, deg1) {
    if (deg1 - deg0 >= 359.99) deg1 = deg0 + 359.99;
    var grand = deg1 - deg0 > 180 ? 1 : 0;
    var a = point(R_EXT, deg0), b = point(R_EXT, deg1);
    var c = point(R_INT, deg1), d = point(R_INT, deg0);
    return 'M' + a.x + ' ' + a.y + 'A' + R_EXT + ' ' + R_EXT + ' 0 ' + grand + ' 1 ' + b.x + ' ' + b.y
      + 'L' + c.x + ' ' + c.y + 'A' + R_INT + ' ' + R_INT + ' 0 ' + grand + ' 0 ' + d.x + ' ' + d.y + 'Z';
  }

  function el(nom, attrs, parent) {
    var n = document.createElementNS(NS, nom);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }

  var svg = document.getElementById('cadran');
  var passe, courant, astre;

  /** Le fond du cadran : ne change qu'une fois par heure temporaire. */
  function dessinerCadran(e) {
    var deg = function (ms) { return Soleil.fraction(e, ms) * 360; };
    var coucher = deg(e.cycle.coucher);
    svg.textContent = '';

    el('path', { 'class': 'bande-jour', d: secteur(0, coucher) }, svg);
    el('path', { 'class': 'bande-nuit', d: secteur(coucher, 360) }, svg);
    passe = el('path', { 'class': 'passe', 'data-p': e.periode }, svg);
    courant = el('path', { 'class': 'courant', 'data-p': e.periode }, svg);

    // Les vingt-quatre divisions, et un chiffre au milieu de chaque heure.
    var periodes = [
      { p: 'jour', debut: e.cycle.debut, fin: e.cycle.coucher },
      { p: 'nuit', debut: e.cycle.coucher, fin: e.cycle.fin }
    ];
    periodes.forEach(function (per) {
      var pas = (per.fin - per.debut) / 12;
      for (var i = 0; i < 12; i++) {
        var a0 = deg(per.debut + i * pas);
        if (i > 0) {
          var p1 = point(R_INT, a0), p2 = point(R_EXT, a0);
          el('line', { 'class': 'trait', x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y }, svg);
        }
        var m = point(R_CHIFFRE, deg(per.debut + (i + 0.5) * pas));
        var actif = per.p === e.periode && i === e.index;
        var t = el('text', { 'class': 'chiffre' + (actif ? ' actif' : ''), 'data-p': per.p, x: m.x, y: m.y }, svg);
        t.textContent = Soleil.ROMAINS[i];
      }
    });

    // Lever et coucher : un filet doré, et un petit repère à l'extérieur.
    [0, coucher].forEach(function (a, n) {
      var p1 = point(R_INT, a), p2 = point(R_EXT, a);
      el('line', { 'class': 'trait horizon', x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y }, svg);
    });

    el('circle', { 'class': 'contour', cx: C, cy: C, r: R_EXT }, svg);
    el('circle', { 'class': 'contour', cx: C, cy: C, r: R_INT }, svg);

    // L'astre du moment, qui fait le tour à l'extérieur de l'anneau.
    astre = el('g', {}, svg);
    if (e.periode === 'jour') {
      el('circle', { 'class': 'astre-halo', r: 9.5 }, astre);
      el('circle', { 'class': 'astre-soleil', r: 6 }, astre);
    } else {
      el('circle', { 'class': 'astre-lune', r: 6.5 }, astre);
      el('circle', { 'class': 'astre-ombre', cx: 3.4, cy: -2.2, r: 5.4 }, astre);
    }
  }

  /** Ce qui bouge à chaque seconde : l'astre et les deux aplats d'avancement. */
  function avancerCadran(e) {
    var deg = function (ms) { return Soleil.fraction(e, ms) * 360; };
    var ici = deg(e.instant);
    passe.setAttribute('d', ici - deg(e.debutPeriode) > 0.05 ? secteur(deg(e.debutPeriode), ici) : '');
    courant.setAttribute('d', ici - deg(e.debutHeure) > 0.05 ? secteur(deg(e.debutHeure), ici) : '');
    var p = point(R_ASTRE, ici);
    astre.setAttribute('transform', 'translate(' + p.x.toFixed(2) + ' ' + p.y.toFixed(2) + ')');
  }

  // --- Tables --------------------------------------------------------------

  function remplir(tbody, heures, periode, e) {
    tbody.textContent = '';
    heures.forEach(function (h, i) {
      var tr = document.createElement('tr');
      if (e.instant >= h.fin) tr.className = 'passee';
      if (periode === e.periode && i === e.index) tr.className = 'active';
      tr.innerHTML = '<td>' + Soleil.ROMAINS[i] + '</td>'
        + '<td>' + hm(h.debut) + '<span class="tiret">–</span>' + hm(h.fin) + '</td>';
      tbody.appendChild(tr);
    });
  }

  // --- Boucle --------------------------------------------------------------

  var $ = function (id) { return document.getElementById(id); };
  var cleCadran = '', cleJour = '';

  function texte(id, valeur) {
    var n = $(id);
    if (n.textContent !== valeur) n.textContent = valeur;
  }

  function maj() {
    var e;
    try { e = Soleil.etat(maintenant(), LIEU); }
    catch (err) { texte('nom-heure', err.message); return; }

    var d = new Date(e.instant);

    // Une fois par jour
    var jour = d.toDateString();
    if (jour !== cleJour) {
      cleJour = jour;
      texte('date', JOURS[d.getDay()].replace(/^./, function (c) { return c.toUpperCase(); })
        + ' ' + (d.getDate() === 1 ? '1er' : d.getDate()) + ' ' + MOIS[d.getMonth()] + ' ' + d.getFullYear());
      $('soleil-infos').innerHTML = 'Lever <strong>' + hm(e.aujourdhui.lever) + '</strong>'
        + '<span class="sep">·</span>Coucher <strong>' + hm(e.aujourdhui.coucher) + '</strong>'
        + '<span class="sep">·</span>Jour de ' + duree(e.dureeJour)
        + ' <span title="par rapport à hier">(' + ecartJour(e.dureeJour - e.dureeJourHier) + ')</span>';
    }

    // Une fois par heure temporaire
    var cle = e.periode + e.index + e.cycle.debut;
    if (cle !== cleCadran) {
      cleCadran = cle;
      racine.setAttribute('data-periode', e.periode);
      dessinerCadran(e);
      remplir($('table-jour'), e.heuresJour, 'jour', e);
      remplir($('table-nuit'), e.heuresNuit, 'nuit', e);
      texte('st-jour', '12 × ' + minutes(e.heuresJour[0].fin - e.heuresJour[0].debut));
      texte('st-nuit', '12 × ' + minutes(e.heuresNuit[0].fin - e.heuresNuit[0].debut));
      texte('nom-heure', e.nom);
      texte('detail', 'jusqu’à ' + hm(e.finHeure) + ' · ' + minutes(e.dureeHeure));
      document.title = e.romain + ' — Heures temporaires';
      $('piste').style.transition = 'none';          // pas de recul animé au changement d'heure
      signalerHauteur();
    }

    // À chaque seconde
    avancerCadran(e);
    texte('heure-civile', horloge(e.instant));
    var piste = $('piste');
    piste.style.width = (e.progression * 100).toFixed(2) + '%';
    if (piste.style.transition === 'none') {
      piste.offsetWidth;                               // forcer le rendu avant de rétablir l'animation
      piste.style.transition = '';
    }
    var reste = Math.ceil((e.finHeure - e.instant) / 60000);
    texte('progression', Math.floor(e.progression * 100) + ' % de l’heure écoulée · encore '
      + reste + ' min');
  }

  // --- Dialogue avec l'app de la barre des menus ---------------------------

  function signaler(message) {
    var h = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.barre;
    if (h) h.postMessage(message);
  }
  function signalerHauteur() {
    if (barre) requestAnimationFrame(function () {
      signaler({ hauteur: Math.ceil(document.body.getBoundingClientRect().height) });
    });
  }

  $('bascule').addEventListener('click', function () {
    racine.classList.toggle('ouvert');
    this.textContent = racine.classList.contains('ouvert') ? 'Refermer' : 'Les vingt-quatre heures';
    signalerHauteur();
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') signaler({ fermer: true });
    if (barre && (ev.key === ' ' || ev.key === 'Enter')) { ev.preventDefault(); $('bascule').click(); }
  });

  // L'app appelle HT.maj() quand le panneau réapparaît, pour ne pas montrer
  // une seconde périmée pendant que les minuteries reprennent.
  window.HT = { maj: maj };

  maj();
  setInterval(maj, 1000);
})();
</script>
</body>
</html>
